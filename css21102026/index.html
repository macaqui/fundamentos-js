<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi mejor deseo</title>
    <!-- React y Babel incluidos en el proyecto: funcionan sin internet -->
    <script src="../vendor/react.development.js"></script>
    <script src="../vendor/react-dom.development.js"></script>
    <!-- (Babel local) -->
    <script src="../vendor/babel.min.js"></script>
    <link rel="stylesheet" href="./style.css">

</head>

<body>

    <div id="root"></div>

    <script type="text/babel">
        //  esto es un hook // 
        const { useState, useEffect } = React;

        const Info = () => {
            const [data, setData] = useState([1]); // Datos que vienen del backend
            const [currentInfo, setCurrentInfo] = useState(1);

            useEffect(() => {
                fetch("/items")
                    .then((res) => res.json())
                    .then((res) => {
                        console.log(res.data);
                        setData(res.data);
                        if (res.data && res.data.length > 0) {
                            setCurrentInfo(res.data[0]);
                        }
                    })
                    .catch((e) => console.log(e))
            }, [])


            return (
                <>
                    <h1>Mi mejor deseo</h1>
                    <img src={`img/${currentInfo}.jpg`} alt="info" />

                    <div className="botones">
                        {data.map((item, index) => (
                            <button key={index} onClick={() => setCurrentInfo(item)}>
                                Push me {item}
                            </button>
                        ))}
                    </div>
                </>
            )
        }

        // Lista de deseos: lee, crea y borra con la API REST
        const Deseos = () => {
            const [deseos, setDeseos] = useState([]);
            const [nombre, setNombre] = useState("");
            const [imagen, setImagen] = useState("1");

            const cargar = () => {
                fetch("/api/deseos")
                    .then((res) => res.json())
                    .then((res) => setDeseos(res))
                    .catch((e) => console.log(e));
            };

            useEffect(cargar, []);

            const crear = (e) => {
                e.preventDefault();
                fetch("/api/deseos", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nombre: nombre, imagen: imagen })
                })
                    .then((res) => res.json())
                    .then(() => {
                        setNombre("");
                        cargar();
                    })
                    .catch((e) => console.log(e));
            };

            const borrar = (id) => {
                fetch("/api/deseos/" + id, { method: "DELETE" })
                    .then((res) => res.json())
                    .then(() => cargar())
                    .catch((e) => console.log(e));
            };

            return (
                <section className="deseos">
                    <h2>Mis deseos</h2>

                    <form onSubmit={crear}>
                        <input
                            type="text"
                            placeholder="Nombre"
                            value={nombre}
                            onChange={(e) => setNombre(e.target.value)}
                            required
                        />
                        <input
                            type="number"
                            min="1"
                            placeholder="Imagen"
                            value={imagen}
                            onChange={(e) => setImagen(e.target.value)}
                            required
                        />
                        <button type="submit">Agregar</button>
                    </form>

                    <ul>
                        {deseos.map((d) => (
                            <li key={d.id}>
                                <span>{d.nombre}</span>
                                <img className="mini" src={`img/${d.imagen}.jpg`} alt={`Imagen ${d.imagen}`} />
                                <button type="button" onClick={() => borrar(d.id)}>Borrar</button>
                            </li>
                        ))}
                    </ul>
                </section>
            );
        }

        // Renderizar la aplicación en el DOM virtual
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <>
                <Info />
                <Deseos />
            </>
        );
    </script>
</body>

</html>
